name: Sync UK Routing and Map Tiles to R2

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      sync_pmtiles:
        description: 'Also re-extract and upload .pmtiles vector map archives (~1.9 GB)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install go-pmtiles CLI
        if: ${{ inputs.sync_pmtiles == true }}
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/latest/download/go-pmtiles_Linux_x86_64.tar.gz | tar -xz -C tools pmtiles
          chmod +x tools/pmtiles

      - name: Sync UK .rd5 (and optional .pmtiles) to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ "${{ inputs.sync_pmtiles }}" = "true" ]; then
            python3 tools/sync_r2.py --setup-bucket --rd5 --pmtiles
          else
            python3 tools/sync_r2.py --setup-bucket --rd5
          fi
