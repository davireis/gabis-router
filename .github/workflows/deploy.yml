name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: |
          WASM_BINDGEN_VERSION=$(cargo pkgid wasm-bindgen | cut -d@ -f2)
          cargo install -f wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build WASM and web bundle
        env:
          VITE_SEGMENTS_BASE_URL: https://tiles.surita.dev/segments4
          VITE_MAP_TILES_BASE_URL: https://tiles.surita.dev/map-tiles
          VITE_PUBLIC_WEB_URL: https://router.surita.dev
          VITE_THUNDERFOREST_KEY: ${{ secrets.VITE_THUNDERFOREST_KEY || vars.VITE_THUNDERFOREST_KEY }}
        run: |
          npm --prefix web run build:wasm
          npm --prefix web run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
